trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerHubServiceConnection: dockerhub-vendemefacil
  dockerHubNamespace: murdoksc
  azureServiceConnection: azure-vendemefacil-production
  resourceGroup: rg-vendemefacil-prod
  apiContainerApp: ca-vendemefacil-api
  webContainerApp: ca-vendemefacil-web
  imageTag: $(Build.BuildId)

stages:
  - stage: Validate
    displayName: Validar aplicaciones
    jobs:
      - job: Validate
        displayName: Compilar API y frontend
        steps:
          - task: UseDotNet@2
            displayName: Instalar .NET SDK 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: dotnet restore VendemeFacil.slnx --configfile NuGet.Config
            displayName: Restaurar dependencias de .NET

          - script: dotnet build VendemeFacil.slnx --configuration Release --no-restore
            displayName: Compilar API

          - script: dotnet test tests/api/VendemeFacil.Api.Tests.csproj --configuration Release --no-build
            displayName: Ejecutar pruebas del backend

          - task: NodeTool@0
            displayName: Instalar Node.js 24
            inputs:
              versionSpec: 24.x

          - script: npm ci
            workingDirectory: apps/web
            displayName: Restaurar dependencias del frontend

          - script: npm run build
            workingDirectory: apps/web
            displayName: Compilar frontend

          - script: npm run lint
            workingDirectory: apps/web
            displayName: Analizar frontend

          - script: npm test
            workingDirectory: apps/web
            displayName: Ejecutar pruebas del frontend

  - stage: Publish
    displayName: Publicar imágenes en Docker Hub
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishImages
        displayName: Construir y publicar imágenes
        steps:
          - task: Docker@2
            displayName: Publicar imagen del API
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerHubServiceConnection)
              repository: $(dockerHubNamespace)/vendemefacil
              dockerfile: apps/api/Dockerfile
              buildContext: .
              tags: |
                api-$(imageTag)
                api-latest

          - task: Docker@2
            displayName: Construir imagen del frontend
            inputs:
              command: build
              containerRegistry: $(dockerHubServiceConnection)
              repository: $(dockerHubNamespace)/vendemefacil
              dockerfile: apps/web/Dockerfile
              buildContext: .
              arguments: --build-arg APP_VERSION=$(imageTag)
              tags: |
                web-$(imageTag)
                web-latest

          - task: Docker@2
            displayName: Publicar imagen del frontend
            inputs:
              command: push
              containerRegistry: $(dockerHubServiceConnection)
              repository: $(dockerHubNamespace)/vendemefacil
              tags: |
                web-$(imageTag)
                web-latest

  - stage: Deploy
    displayName: Desplegar en producción
    dependsOn: Publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        displayName: Desplegar Container Apps
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: AzureCLI@2
                  displayName: Desplegar y verificar Build $(imageTag)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az extension add --name containerapp --upgrade --only-show-errors

                      api_image="docker.io/$(dockerHubNamespace)/vendemefacil:api-$(imageTag)"
                      web_image="docker.io/$(dockerHubNamespace)/vendemefacil:web-$(imageTag)"

                      previous_api_image=$(az containerapp show \
                        --name "$(apiContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --query 'properties.template.containers[0].image' \
                        --output tsv)

                      previous_web_image=$(az containerapp show \
                        --name "$(webContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --query 'properties.template.containers[0].image' \
                        --output tsv)

                      api_updated=false
                      web_updated=false

                      rollback() {
                        echo "El despliegue no superó las verificaciones. Restaurando imágenes anteriores."
                        if [ "$web_updated" = true ]; then
                          az containerapp update \
                            --name "$(webContainerApp)" \
                            --resource-group "$(resourceGroup)" \
                            --image "$previous_web_image" \
                            --output none || true
                        fi
                        if [ "$api_updated" = true ]; then
                          az containerapp update \
                            --name "$(apiContainerApp)" \
                            --resource-group "$(resourceGroup)" \
                            --image "$previous_api_image" \
                            --output none || true
                        fi
                      }

                      trap rollback ERR

                      az containerapp update \
                        --name "$(apiContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$api_image" \
                        --output none
                      api_updated=true

                      api_fqdn=$(az containerapp show \
                        --name "$(apiContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --query 'properties.configuration.ingress.fqdn' \
                        --output tsv)

                      curl --fail --silent --show-error \
                        --retry 18 --retry-delay 10 --retry-all-errors \
                        --max-time 20 "https://$api_fqdn/api/health" > /dev/null
                      curl --fail --silent --show-error \
                        --retry 6 --retry-delay 10 --retry-all-errors \
                        --max-time 20 "https://$api_fqdn/api/health/database" > /dev/null

                      az containerapp update \
                        --name "$(webContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$web_image" \
                        --output none
                      web_updated=true

                      web_fqdn=$(az containerapp show \
                        --name "$(webContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --query 'properties.configuration.ingress.fqdn' \
                        --output tsv)

                      curl --fail --silent --show-error \
                        --retry 18 --retry-delay 10 --retry-all-errors \
                        --max-time 20 "https://$web_fqdn/health" > /dev/null

                      trap - ERR
                      echo "Build $(imageTag) desplegado y verificado correctamente."
